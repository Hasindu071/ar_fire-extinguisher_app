            max-width: 500px;

        /* Reset button for markerless mode */

            z-index: 10;
            top: 20px;
            left: 20px;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 15px;
        }
    </style>
</head>

<script>
AFRAME.registerComponent('mouse-rotate', {
    init: function () {
        this.dragging = false;
        this.lastX = 0;
        this.lastY = 0;

        this.el.sceneEl.canvas.addEventListener('mousedown', (e) => {
            this.dragging = true;
            this.lastX = e.clientX;
            this.lastY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            this.dragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (!this.dragging || this.el.components['drag-extinguisher']?.isDragging) return;

            const dx = e.clientX - this.lastX;
            const dy = e.clientY - this.lastY;

            const rotation = this.el.getAttribute('rotation');

            rotation.y += dx * 0.5;
            rotation.x += dy * 0.5;

            this.el.setAttribute('rotation', rotation);

            this.lastX = e.clientX;
            this.lastY = e.clientY;
        });
    }
});
</script>

    <!-- Markerless AR (WebXR) module: only starts once the user picks "Markerless AR" -->
    <script type="module">
    import * as THREE from "three";
    import { ARButton } from "three/addons/webxr/ARButton.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const statusEl = document.getElementById("status");
    const startButton = document.getElementById("start");
    const pickerEl = document.getElementById("markerlessPicker");
    const resetButtonEl = document.getElementById("markerlessResetButton");
    const webxrSceneEl = document.getElementById("webxrScene");
    let arButtonRef = null; // keep a handle on the AR button so we can re-click it on later visits

    function show(text) {
        statusEl.innerHTML = text;
        console.log(text);
    }

    let camera, scene, renderer;
    let reticle;
    let shadowCatcher;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let webxrInitialized = false;

    // GLB model paths for each extinguisher type (reuse the same assets
    // already used by the marker-based scene)
    const EXTINGUISHER_MODELS = {
        co2:    "assets/models/co2_silinder.glb",
        foam:   "assets/models/foam_silinder.glb",
        powder: "assets/models/powder_silinder.glb",
        water:  "assets/models/water_silinder.glb"
    };

    // Adjust per-model scale here if one type looks too big/small once placed
    const EXTINGUISHER_SCALE = {
        co2:    0.3,
        foam:   0.3,
        powder: 0.3,
        water:  0.3
    };

    // How much the model rotates (around Y) per tap once it's already placed
    const ROTATE_STEP = THREE.MathUtils.degToRad(45);

    const gltfLoader = new GLTFLoader();
    const cylinderTemplates = {}; // type -> loaded THREE.Group
    let currentType = "co2";

    // The single placed model + which type it is. Once this is set, taps
    // rotate it instead of placing another one.
    let placedCylinder = null;
    let placedType = null;

    function loadCylinderModel(type) {
        if (cylinderTemplates[type] || cylinderTemplates[type] === "loading") return;
        cylinderTemplates[type] = "loading";
        gltfLoader.load(
            EXTINGUISHER_MODELS[type],
            (gltf) => {
                cylinderTemplates[type] = gltf.scene;
            },
            undefined,
            (error) => {
                console.error(`Failed to load ${type} cylinder model`, error);
                cylinderTemplates[type] = null;
                show(`⚠️ Could not load ${type} model`);
            }
        );
    }

    // Preload all four so switching types in the picker is instant
    function preloadAllCylinderModels() {
        Object.keys(EXTINGUISHER_MODELS).forEach(loadCylinderModel);
    }

    // Remove the currently placed cylinder (used by the "New" reset button)
    function clearPlacedCylinder() {
        if (placedCylinder) {
            scene.remove(placedCylinder);
            placedCylinder = null;
            placedType = null;
        }
        if (resetButtonEl) resetButtonEl.hidden = true;
        show("🔵 Searching for a surface...<br>Move phone slowly over a floor/table");
    }

    // ------------------------------------------------------------
    // EXTINGUISHER TYPE PICKER (markerless mode only)
    // Tapping a cylinder now launches AR immediately — no separate tap needed
    // ------------------------------------------------------------
    if (pickerEl) {
        pickerEl.addEventListener("click", (e) => {
            const btn = e.target.closest(".picker-button");
            if (!btn) return;
            currentType = btn.dataset.type;
            pickerEl.querySelectorAll(".picker-button").forEach((b) => {
                b.classList.toggle("active", b === btn);
            });
            
            // Tapping a cylinder now launches AR immediately — no separate tap needed
            pickerEl.setAttribute("hidden", "");
            if (webxrSceneEl) webxrSceneEl.removeAttribute("hidden");
            window.startWebXRExperience();
        });
    }

    // ------------------------------------------------------------
    // RESET BUTTON: clears the placed model so a new one (possibly a
    // different type from the picker) can be placed again
    // ------------------------------------------------------------
    if (resetButtonEl) {
        resetButtonEl.addEventListener("click", clearPlacedCylinder);
    }

    // ------------------------------------------------------------
    // CHECK WEBXR SUPPORT FIRST
    // ------------------------------------------------------------
    async function checkWebXR() {
        if (!navigator.xr) {
            show("❌ WebXR NOT available in this browser<br>(try Chrome on Android with ARCore)");
            startButton.disabled = true;
            return;
        }
        try {
            const supported = await navigator.xr.isSessionSupported("immersive-ar");
            if (!supported) {
                show("❌ immersive-ar NOT supported on this device");
                startButton.disabled = true;
                return;
            }
            show("✅ immersive-ar supported. Tap Start AR.");
        } catch (error) {
            show("❌ WebXR check error<br>" + error.message);
        }
    }

    // ARButton only wires up its real click handler after an internal async
    // "immersive-ar" support check resolves. Poll briefly until it's ready
    // (text becomes "START AR"), then click it for the user.
    function autoStartAR(arButton, attempt = 0) {
        if (arButton.textContent === "START AR") {
            arButton.click();
            return;
        }
        if (arButton.textContent && arButton.textContent.toUpperCase().includes("NOT")) {
            // Genuinely unsupported — let the button's own message stand
            show("❌ AR not supported on this device/browser");
            return;
        }
        if (attempt > 100) { // ~5s safety timeout
            show("❌ Could not start AR automatically — device may not support it");
            return;
        }
        setTimeout(() => autoStartAR(arButton, attempt + 1), 50);
    }

    // ------------------------------------------------------------
    // SETUP THREE.JS SCENE
    // ------------------------------------------------------------
    function initWebXRScene() {
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(
            70,
            window.innerWidth / window.innerHeight,
            0.01,
            20
        );

        // Soft fill light so shadows aren't pitch black
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 0.6);
        hemiLight.position.set(0.5, 1, 0.25);
        scene.add(hemiLight);

        // Key light: this is the one that actually casts shadows.
        // GLB materials generally need a directional light too, unlike a
        // plain MeshBasicMaterial box which ignores lighting entirely
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
        dirLight.position.set(1, 2, 1);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(1024, 1024);
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 5;
        dirLight.shadow.camera.left = -1;
        dirLight.shadow.camera.right = 1;
        dirLight.shadow.camera.top = 1;
        dirLight.shadow.camera.bottom = -1;
        dirLight.shadow.bias = -0.001;
        scene.add(dirLight);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById("webxrScene").appendChild(renderer.domElement);

        // ARButton handles requestSession + the required WebGL/XRWebGLLayer wiring
        const arButton = ARButton.createButton(renderer, {
            requiredFeatures: ["hit-test"]
        });
        document.getElementById("webxrScene").appendChild(arButton);
        startButton.style.display = "none"; // ARButton replaces our manual button
        
        arButtonRef = arButton; // remember it for future re-entries
        // Skip the manual "Start AR" tap — auto-click ARButton as soon as it's ready
        autoStartAR(arButton);

        // Reticle = ring showing where a surface was detected
        const reticleGeo = new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI / 2);
        const reticleMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        reticle = new THREE.Mesh(reticleGeo, reticleMat);
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        // Invisible plane that only renders the shadows cast onto it, so
        // placed extinguishers look grounded on the real-world floor/table
        // instead of floating with no contact shadow.
        const shadowGeo = new THREE.PlaneGeometry(2, 2).rotateX(-Math.PI / 2);
        const shadowMat = new THREE.ShadowMaterial({ opacity: 0.35 });
        shadowCatcher = new THREE.Mesh(shadowGeo, shadowMat);
        shadowCatcher.receiveShadow = true;
        shadowCatcher.visible = false;
        scene.add(shadowCatcher);

        // Show the extinguisher-type picker once we're in the AR scene
        if (pickerEl) pickerEl.hidden = false;

        preloadAllCylinderModels();

        // Tap behavior:
        //  - Nothing placed yet  -> place the currently selected type at the reticle
        //  - Already placed      -> rotate that SAME model around Y (no new model spawned)
        const controller = renderer.xr.getController(0);
        controller.addEventListener("select", () => {
            if (!placedCylinder) {
                if (!reticle.visible) {
                    show("⚠️ No surface detected yet");
                    return;
                }

                const template = cylinderTemplates[currentType];
                if (!template || template === "loading") {
                    show(`⚠️ ${currentType} model still loading, try again in a moment`);
                    return;
                }

                placedCylinder = template.clone(true);
                placedType = currentType;
                placedCylinder.position.setFromMatrixPosition(reticle.matrix);

                const s = EXTINGUISHER_SCALE[currentType] ?? 0.3;
                placedCylinder.scale.set(s, s, s);

                // Face the cylinder toward the camera on placement
                placedCylinder.quaternion.copy(camera.quaternion);

                // Let this model cast a shadow onto the shadow catcher / other models
                placedCylinder.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });

                scene.add(placedCylinder);
                if (resetButtonEl) resetButtonEl.hidden = false;

                show(`🟢 ${placedType} extinguisher placed!<br>Tap again to rotate it.`);
                return;
            }

            // Already placed: rotate instead of adding another model
            placedCylinder.rotation.y += ROTATE_STEP;
            show(`🔄 Rotated ${placedType} extinguisher.<br>Tap "↺ New" to place a different one.`);
        });
        scene.add(controller);

        // Hide the picker/reset button again if the AR session ends, and
        // clear out the placed model so a fresh session starts empty
        renderer.xr.addEventListener("sessionend", () => {
            if (resetButtonEl) resetButtonEl.hidden = true;
            clearPlacedCylinder();
            
            if (webxrSceneEl) webxrSceneEl.setAttribute("hidden", "");
            if (pickerEl) pickerEl.removeAttribute("hidden");
        });

        window.addEventListener("resize", onWindowResize);

        renderer.setAnimationLoop(render);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ------------------------------------------------------------
    // RENDER + HIT TEST LOOP
    // ------------------------------------------------------------
    function render(timestamp, frame) {
        if (frame) {
            const referenceSpace = renderer.xr.getReferenceSpace();
            const session = renderer.xr.getSession();

            if (!hitTestSourceRequested) {
                session.requestReferenceSpace("viewer").then((viewerSpace) => {
                    session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                        hitTestSource = source;
                    });
                });

                session.addEventListener("end", () => {
                    hitTestSourceRequested = false;
                    hitTestSource = null;
                });

                hitTestSourceRequested = true;
            }

            if (hitTestSource) {
                const hitTestResults = frame.getHitTestResults(hitTestSource);

                if (hitTestResults.length > 0) {
                    const hit = hitTestResults[0];
                    const pose = hit.getPose(referenceSpace);

                    reticle.visible = true;
                    reticle.matrix.fromArray(pose.transform.matrix);

                    // Keep the shadow-catcher plane locked to the detected surface
                    shadowCatcher.position.setFromMatrixPosition(reticle.matrix);
                    shadowCatcher.visible = true;

                    // Only overwrite the status text with "searching/found surface"
                    // messages when nothing has been placed yet, so we don't stomp
                    // on the "placed!" / "rotated!" messages once a model is down.
                    if (!placedCylinder) {
                        show("🟢 Surface detected — tap screen to place model");
                    }
                } else {
                    reticle.visible = false;
                    shadowCatcher.visible = false;
                    if (!placedCylinder) {
                        show("🔵 Searching for a surface...<br>Move phone slowly over a floor/table");
                    }
                }
            }
        }

        renderer.render(scene, camera);
    }

    // Exposed entry point: called when the user selects Markerless AR.
    // First time: builds the scene and auto-clicks the AR button.
    // Subsequent times: just re-clicks the existing AR button.
    window.startWebXRExperience = function () {
        checkWebXR();
        if (!webxrInitialized) {
            webxrInitialized = true;
            initWebXRScene(); // first time: builds the scene, auto-clicks AR button
        } else if (arButtonRef) {
            // Returning from a previous session — three.js resets the button back
            // to "START AR" on sessionend, so just auto-click it again
            autoStartAR(arButtonRef);
        }
    };
    </script>

    <script src="app.js"></script>

</body>
</html>
