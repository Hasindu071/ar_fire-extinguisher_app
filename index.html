<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR Fire Extinguisher App</title>

    <!-- Importing A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<script>
AFRAME.registerComponent('mouse-rotate', {
    init: function () {
        this.dragging = false;
        this.lastX = 0;
        this.lastY = 0;

        this.el.sceneEl.canvas.addEventListener('mousedown', (e) => {
            this.dragging = true;
            this.lastX = e.clientX;
            this.lastY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            this.dragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (!this.dragging) return;

            const dx = e.clientX - this.lastX;
            const dy = e.clientY - this.lastY;

            const rotation = this.el.getAttribute('rotation');

            rotation.y += dx * 0.5;
            rotation.x += dy * 0.5;

            this.el.setAttribute('rotation', rotation);

            this.lastX = e.clientX;
            this.lastY = e.clientY;
        });
    }
});
</script>

<body>

    <!-- The container which holds the AR content -->
    <a-scene
        mindar-image="imageTargetSrc: ./fire_extinguishers.mind;"
        color-space="sRGB"
        renderer="colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!--We are saying load these assests and keep them there can be multiple models loaded -->
        <a-assets>
            <img
                id="rackImage"
                src="assets/images/background.jpg">

            <a-asset-item
                id="fire"
                src="assets/models/fire.glb">
            </a-asset-item>

            <a-asset-item
                id="co2Fire"
                src="assets/models/co2_fire.glb">
            </a-asset-item>

            <a-asset-item
                id="dryPowderFire"
                src="assets/models/dry_powder_fire.glb">
            </a-asset-item>

            <a-asset-item
                id="foamFire"
                src="assets/models/foam_fire.glb">
            </a-asset-item>

            <a-asset-item
                id="waterFire"
                src="assets/models/water_fire.glb">
            </a-asset-item>

            <a-asset-item
                id="co2Extinguisher"
                src="assets/models/co2_silinder.glb">
            </a-asset-item>

            <a-asset-item
                id="foamExtinguisher"
                src="assets/models/foam_silinder.glb">
            </a-asset-item>

            <a-asset-item
                id="powderExtinguisher"
                src="assets/models/powder_silinder.glb">
            </a-asset-item>

            <a-asset-item
                id="waterExtinguisher"
                src="assets/models/water_silinder.glb">
            </a-asset-item>

        </a-assets>


        <!--Users view point-->
        <!-- position of the camera of the user 0 1.2 2 means X = 0 , Y = 1.2 , Z = 2 -->
        <a-camera
            position="0 1.2 2">
        </a-camera>
        
        <a-entity
        id="markerTarget"
        mindar-image-target="targetIndex: 0">

        
                <a-image
                    src="#rackImage"
                    position="0 0 0"
                    width="3.2"
                    height="1.95">
                </a-image>

                <a-entity
                    id="fireEntity"
                    gltf-model="#fire"
                    position="2.65 -0.7 0.5"
                    rotation="0 0 0"
                    scale="0.2 0.2 0.2"
                    visible="false"
                    mouse-rotate>
                </a-entity> 

                <a-entity
                    gltf-model="#co2Extinguisher"
                    position="-0.65 -0.7 0.5"
                    rotation="0 0 0"
                    scale="1.7 1.7 1.7"
                    mouse-rotate>
                </a-entity>

                <a-entity
                    gltf-model="#foamExtinguisher"
                    position="-0.25 -0.7 0.5"
                    rotation="0 0 0"
                    scale="1.5 1.5 1.5"
                    mouse-rotate>
                </a-entity>

                <a-entity
                    gltf-model="#powderExtinguisher"
                    position="0.15 -0.7 0.5"
                    rotation="0 0 0"
                    scale="1.5 1.5 1.5"
                    mouse-rotate>
                </a-entity>

                <a-entity
                    gltf-model="#waterExtinguisher"
                    position="0.55 -0.7 0.5"
                    rotation="0 0 0"
                    scale="1.5 1.5 1.5"
                    mouse-rotate>
                </a-entity>

        </a-entity>

        <a-entity light="type: ambient; intensity: 1.1"></a-entity>
        <a-entity light="type: directional; intensity: 1.2" position="-1 2 1"></a-entity>


    </a-scene>

    <button id="startFireButton" class="start-fire-button" aria-label="Start fire" hidden>Start</button>

    <script src="app.js"></script>

</body>
</html>
