<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR Fire Extinguisher App</title>

    <!-- Importing A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- AR.js with ARLite for iPhone/Android compatibility -->
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.5/three.js/ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/a-frame-ar@1.3.5/dist/aframe-ar.js"></script>

    <!-- Import map for the WebXR (markerless) Three.js experience -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>

    <link rel="stylesheet" href="style.css">

    <style>
        /* Mode selection landing screen */
        #modeSelectScreen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: #0d0d0f;
            color: #fff;
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 24px;
        }
        #modeSelectScreen[hidden] {
            display: none;
        }
        #modeSelectScreen h1 {
            margin: 0 0 4px 0;
            font-size: 1.6rem;
        }
        #modeSelectScreen p {
            margin: 0 0 12px 0;
            opacity: 0.8;
        }
        .mode-select-button {
            width: 260px;
            max-width: 80vw;
            padding: 16px 20px;
            font-size: 17px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: #2196f3;
            color: #fff;
            font-weight: 600;
        }
        .mode-select-button.secondary {
            background: #424242;
        }
        .mode-select-button:active {
            opacity: 0.85;
        }

        /* WebXR (markerless) test container */
        #webxrScene {
            position: fixed;
            inset: 0;
            z-index: 5;
        }
        #webxrScene #status {
            position: fixed;
            z-index: 10;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 18px;
            background: rgba(0,0,0,0.75);
            color: white;
            border-radius: 10px;
            text-align: center;
            max-width: 90%;
            font-family: Arial, sans-serif;
        }
        #webxrScene #start {
            position: fixed;
            z-index: 10;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            padding: 15px 25px;
            font-size: 18px;
        }
        #webxrBackButton {
            position: fixed;
            z-index: 10;
            top: 20px;
            left: 20px;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 15px;
        }
    </style>
</head>

<script>
AFRAME.registerComponent('mouse-rotate', {
    init: function () {
        this.dragging = false;
        this.lastX = 0;
        this.lastY = 0;

        this.el.sceneEl.canvas.addEventListener('mousedown', (e) => {
            this.dragging = true;
            this.lastX = e.clientX;
            this.lastY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            this.dragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (!this.dragging || this.el.components['drag-extinguisher']?.isDragging) return;

            const dx = e.clientX - this.lastX;
            const dy = e.clientY - this.lastY;

            const rotation = this.el.getAttribute('rotation');

            rotation.y += dx * 0.5;
            rotation.x += dy * 0.5;

            this.el.setAttribute('rotation', rotation);

            this.lastX = e.clientX;
            this.lastY = e.clientY;
        });
    }
});
</script>

<body>

    <!-- Mode selection landing screen: choose Marker Based or Markerless AR -->
    <div id="modeSelectScreen" class="mode-select-screen">
        <h1>Fire Extinguisher AR</h1>
        <p>Choose how you'd like to run the experience</p>
        <button id="markerModeButton" class="mode-select-button">Marker Based AR</button>
        <button id="markerlessModeButton" class="mode-select-button secondary">Markerless AR (WebXR)</button>
    </div>

    <!-- Markerless (WebXR) compatibility test experience -->
    <div id="webxrScene" hidden>
        <button id="webxrBackButton" aria-label="Back to mode selection">← Back</button>
        <div id="status">Checking WebXR...</div>
        <button id="start">Start AR</button>
    </div>

    <!-- Fire type label display at top -->
    <div id="fireTypeLabel" class="fire-type-label" hidden></div>
    
    <!-- Status label for Done/Wrong messages -->
    <div id="statusLabel" class="status-label" hidden></div>

    <!-- Mode indicator -->
    <div id="modeIndicator" class="mode-indicator" hidden></div>

    <!-- Back button for marker-based AR -->
    <button id="markerBackButton" class="back-button" aria-label="Back to mode selection" hidden>← Back</button>

    <!-- Markerless AR loading screen -->
    <div id="arLoadingScreen" class="ar-loading-screen" hidden>
        <div class="spinner"></div>
        <p>Initializing Markerless AR...</p>
        <p class="instruction">Point your camera at a flat surface</p>
    </div>

    <!-- The container which holds the marker-based AR content -->
    <a-scene
        id="markerScene"
        mindar-image="imageTargetSrc: ./fire_extinguishers.mind;"
        color-space="sRGB"
        renderer="colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        hidden>

        <!--We are saying load these assests and keep them there can be multiple models loaded -->
        <a-assets>
            <img
                id="rackImage"
                src="assets/images/background.jpg">

            <!-- Fire and extinguisher audio assets -->
            <audio id="fireSound" preload="auto">

            </audio>

            <audio id="extinguisherSound" preload="auto">
                <source src="assets/audio/extinguisher-spray.wav" type="audio/wav">
            </audio>

            <audio id="blasterSound" preload="auto">
                <source src="assets/audio/bomb-blaster.wav" type="audio/wav">
            </audio>

            <a-asset-item
                id="co2Fire"
                src="assets/models/co2_fire.glb">
            </a-asset-item>

            <a-asset-item
                id="dryPowderFire"
                src="assets/models/dry_powder_fire.glb">
            </a-asset-item>

            <a-asset-item
                id="foamFire"
                src="assets/models/foam_fire.glb">
            </a-asset-item>

            <a-asset-item
                id="waterFire"
                src="assets/models/water_fire.glb">
            </a-asset-item>

            <a-asset-item
                id="co2Extinguisher"
                src="assets/models/co2_silinder.glb">
            </a-asset-item>

            <a-asset-item
                id="foamExtinguisher"
                src="assets/models/foam_silinder.glb">
            </a-asset-item>

            <a-asset-item
                id="powderExtinguisher"
                src="assets/models/powder_silinder.glb">
            </a-asset-item>

            <a-asset-item
                id="waterExtinguisher"
                src="assets/models/water_silinder.glb">
            </a-asset-item>

            <a-asset-item
                id="sprayForm"
                src="assets/models/spray_form.glb">
            </a-asset-item>

            <a-asset-item
                id="ashModel"
                src="assets/models/ash.glb">
            </a-asset-item>

            <a-asset-item
                id="correctFireBox"
                src="assets/models/correct_fire_box.glb">
            </a-asset-item>

            <a-asset-item
                id="correctChemical"
                src="assets/models/correct_chemical.glb">
            </a-asset-item>

            <a-asset-item
                id="correctPetrolTank"
                src="assets/models/correct_petrol_tank.glb">
            </a-asset-item>

            <a-asset-item
                id="correctFirecamp"
                src="assets/models/correct_firecamp.glb">
            </a-asset-item>

        </a-assets>


        <!--Users view point-->
        <!-- position of the camera of the user 0 1.2 2 means X = 0 , Y = 1.2 , Z = 2 -->
        <a-camera
            position="0 1.2 2">
        </a-camera>
        
        <a-entity
        id="markerTarget"
        mindar-image-target="targetIndex: 0">

        
                <a-image
                    src="#rackImage"
                    position="0 0 0"
                    width="3.2"
                    height="1.95">
                </a-image>

                <a-entity
                    id="fireEntity"
                    gltf-model="#fire"
                    position="2.65 -0.7 0.5"
                    rotation="0 0 0"
                    scale="0.2 0.2 0.2"
                    visible="false"
                    mouse-rotate>
                </a-entity>

                <!-- Ash model that appears when wrong extinguisher is used -->
                <a-entity
                    id="ashEntity"
                    gltf-model="#ashModel"
                    position="2.65 -0.7 0.5"
                    rotation="0 0 0"
                    scale="1 1 1"
                    visible="false"
                    mouse-rotate>
                </a-entity>

                <!-- Correct result models -->
                <a-entity
                    id="correctFireBoxEntity"
                    gltf-model="#correctFireBox"
                    position="2.65 -0.7 0.5"
                    rotation="0 0 0"
                    scale="2 2 2"
                    visible="false"
                    mouse-rotate>
                </a-entity>

                <a-entity
                    id="correctChemicalEntity"
                    gltf-model="#correctChemical"
                    position="2.65 -0.7 0.5"
                    rotation="0 0 0"
                    scale="0.05 0.05 0.05"
                    visible="false"
                    mouse-rotate>
                </a-entity>

                <a-entity
                    id="correctPetrolTankEntity"
                    gltf-model="#correctPetrolTank"
                    position="2.65 -0.7 0.5"
                    rotation="0 0 0"
                    scale="0.5 0.5 0.5"

                    mouse-rotate>
                </a-entity>

                <a-entity
                    id="correctFirecampEntity"

                </a-entity> 

                <a-entity

                    position="-0.65 -0.7 0.5"

                </a-entity>

                <a-entity
                    gltf-model="#foamExtinguisher"

                <a-entity

                    position="0.15 -0.7 0.5"
                    rotation="0 0 0"
                    scale="1.5 1.5 1.5"
                    mouse-rotate>
                </a-entity>

                <a-entity
                    gltf-model="#waterExtinguisher"
                    drag-extinguisher="target: #markerTarget; extinguisherType: water"
                    position="0.55 -0.7 0.5"
                    rotation="0 0 0"
                    scale="1.5 1.5 1.5"
                    mouse-rotate>

        </a-entity>

        <a-entity light="type: ambient; intensity: 1.1"></a-entity>
        <a-entity light="type: directional; intensity: 1.2" position="-1 2 1"></a-entity>


    </a-scene>

    <!-- Markerless AR Scene using AR.js (ARLite) -->
    <a-scene
        id="markerlessScene"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; matrixCodeType: 3x3;"
        renderer="antialias: true; alpha: true; precision: medium"
        hidden>

        <a-assets id="markerlessAssets">
            <a-asset-item id="co2ExtinguisherMarkerless" src="assets/models/co2_silinder.glb"></a-asset-item>
            <a-asset-item id="foamExtinguisherMarkerless" src="assets/models/foam_silinder.glb"></a-asset-item>
            <a-asset-item id="powderExtinguisherMarkerless" src="assets/models/powder_silinder.glb"></a-asset-item>
            <a-asset-item id="waterExtinguisherMarkerless" src="assets/models/water_silinder.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 1.2 0" look-controls wasd-controls></a-camera>

        <!-- Container for placed cylinders -->
        <a-entity id="cylinderContainer"></a-entity>

        <a-entity light="type: ambient; intensity: 1.3"></a-entity>
        <a-entity light="type: directional; intensity: 1.4" position="2 3 2"></a-entity>

    </a-scene>

    <!-- Overlay for markerless AR controls -->
    <div id="overlay" style="display: none;">
        <button id="backToMarkerButton" class="back-button" aria-label="Back to marker AR">← Back</button>
        <p id="placementInstruction" class="placement-instruction">Tap or click to place fire extinguishers</p>
    </div>

    <button id="startFireButton" class="start-fire-button" aria-label="Start fire" hidden>Start</button>
    <button id="refreshFireButton" class="refresh-fire-button" aria-label="Refresh fire" hidden>New Fire</button>

    <!-- Markerless AR (WebXR) module: only starts once the user picks "Markerless AR" -->
    <script type="module">
    import * as THREE from "three";
    import { ARButton } from "three/addons/webxr/ARButton.js";

    const statusEl = document.getElementById("status");
    const startButton = document.getElementById("start");

    function show(text) {
        statusEl.innerHTML = text;
        console.log(text);
    }

    let camera, scene, renderer;
    let reticle;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let webxrInitialized = false;

    // ------------------------------------------------------------
    // CHECK WEBXR SUPPORT FIRST
    // ------------------------------------------------------------
    async function checkWebXR() {
        if (!navigator.xr) {
            show("❌ WebXR NOT available in this browser<br>(try Chrome on Android with ARCore)");
            startButton.disabled = true;
            return;
        }
        try {
            const supported = await navigator.xr.isSessionSupported("immersive-ar");
            if (!supported) {
                show("❌ immersive-ar NOT supported on this device");
                startButton.disabled = true;
                return;
            }
            show("✅ immersive-ar supported. Tap Start AR.");
        } catch (error) {
            show("❌ WebXR check error<br>" + error.message);
        }
    }

    // ------------------------------------------------------------
    // SETUP THREE.JS SCENE
    // ------------------------------------------------------------
    function initWebXRScene() {
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(
            70,
            window.innerWidth / window.innerHeight,
            0.01,
            20
        );

        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        light.position.set(0.5, 1, 0.25);
        scene.add(light);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.getElementById("webxrScene").appendChild(renderer.domElement);

        // ARButton handles requestSession + the required WebGL/XRWebGLLayer wiring
        const arButton = ARButton.createButton(renderer, {
            requiredFeatures: ["hit-test"]
        });
        document.getElementById("webxrScene").appendChild(arButton);
        startButton.style.display = "none"; // ARButton replaces our manual button

        // Reticle = ring showing where a surface was detected
        const reticleGeo = new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI / 2);
        const reticleMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        reticle = new THREE.Mesh(reticleGeo, reticleMat);
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        // Tap to place a small cube ("the model") at the reticle position
        const controller = renderer.xr.getController(0);
        controller.addEventListener("select", () => {
            if (!reticle.visible) {
                show("⚠️ No surface detected yet");
                return;
            }
            const geometry = new THREE.BoxGeometry(0.08, 0.08, 0.08);
            const material = new THREE.MeshStandardMaterial({ color: 0x2196f3 });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.setFromMatrixPosition(reticle.matrix);
            scene.add(cube);

            show("🟢 Model placed!<br>Hit-test + rendering both work.");
        });
        scene.add(controller);

        window.addEventListener("resize", onWindowResize);

        renderer.setAnimationLoop(render);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ------------------------------------------------------------
    // RENDER + HIT TEST LOOP
    // ------------------------------------------------------------
    function render(timestamp, frame) {
        if (frame) {
            const referenceSpace = renderer.xr.getReferenceSpace();
            const session = renderer.xr.getSession();

            if (!hitTestSourceRequested) {
                session.requestReferenceSpace("viewer").then((viewerSpace) => {
                    session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                        hitTestSource = source;
                    });
                });

                session.addEventListener("end", () => {
                    hitTestSourceRequested = false;
                    hitTestSource = null;
                });

                hitTestSourceRequested = true;
            }

            if (hitTestSource) {
                const hitTestResults = frame.getHitTestResults(hitTestSource);

                if (hitTestResults.length > 0) {
                    const hit = hitTestResults[0];
                    const pose = hit.getPose(referenceSpace);

                    reticle.visible = true;
                    reticle.matrix.fromArray(pose.transform.matrix);
                    show("🟢 Surface detected — tap screen to place model");
                } else {
                    reticle.visible = false;
                    show("🔵 Searching for a surface...<br>Move phone slowly over a floor/table");
                }
            }
        }

        renderer.render(scene, camera);
    }

    // Exposed entry point: called once, the first time the user selects Markerless AR.
    window.startWebXRExperience = function () {
        if (webxrInitialized) return;
        webxrInitialized = true;
        checkWebXR();
        initWebXRScene();
    };
    </script>

    <script src="app.js"></script>

</body>
</html>
